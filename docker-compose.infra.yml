services:
  pgvector:
    container_name: af-pgvector
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: ${PGVECTOR_DATABASE:-af_vectors}
      POSTGRES_USER: ${PGVECTOR_USER:-postgres}
      POSTGRES_PASSWORD: ${PGVECTOR_PASSWORD:-postgres}
    volumes:
      - ${DOCKER_VOLUME_DIRECTORY:-.}/volumes/pgvector:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PGVECTOR_USER:-postgres} -d ${PGVECTOR_DATABASE:-af_vectors}"]
      interval: 30s
      timeout: 20s
      retries: 3
    ports:
      - "5432:5432"

networks:
  default:
    name: af_agent
