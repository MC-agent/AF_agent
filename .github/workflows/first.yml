name: AF agent workflow
on: 
  push:
    branches: 
      - main
  pull_request:
    branches:
      - main

env:
  IMAGE_NAME: af_agent
  TEST_CMD: pytest -q

permissions:
  contents: read
  packages: write
  
jobs: 
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        
      - name: docker build
        uses: docker/setup-buildx-action@v3

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{github.repository_owner}}/${{ env.IMAGE_NAME }}
          tags: | 
            type=raw,value=sha-${{ github.sha }}
            type=ref,event=branch
            type=ref,event=pr
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build (for tests)
        uses: docker/build-push-action@v6
        with:
          load: true
          context: .
          file: ./Dockerfile
          tags: ${{ env.IMAGE_NAME }}:test
          build-args: |
            GIT_SHA=${{ github.sha }}
            BUILD_DATE=${{ steps.meta.outputs.created }} 

      # - name: Run tests inside container
      #   run: |
      #     docker run --rm \
      #       -e CI=true \
      #       ${{ env.IMAGE_NAME }}:test \
      #       bash -lc "${TEST_CMD}"

      - name: Log in to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & Push (main only)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v6
        with:
          push: true
          context: .
          file: ./Dockerfile
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  deploy:
    name: Deploy to EC2
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    
    steps:
    - name: Deploy over SSH
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.SSH_HOST }}
        username: ${{ secrets.SSH_USER }}
        key: ${{ secrets.SSH_PRIVATE_KEY }}
        envs: GITHUB_SHA,GITHUB_REPOSITORY
        script_stop: true
        script: |
       
          set -x   # 어떤 명령이 실행되는지 로그에 다 찍힘 (디버깅용)
  
          # --- 이미지 태그 계산 ---
          GH_OWNER="$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')"
          IMAGE="ghcr.io/$GH_OWNER/af_agent:sha-${GITHUB_SHA}"
          echo "Using image: $IMAGE"
  
          # --- Docker 설치 (없으면) ---
          if ! command -v docker &> /dev/null; then
            sudo apt-get update
            sudo apt-get install -y ca-certificates curl gnupg lsb-release
  
            sudo install -m 0755 -d /etc/apt/keyrings
            curl -fsSL https://download.docker.com/linux/ubuntu/gpg | \
              sudo gpg --batch --yes --dearmor -o /etc/apt/keyrings/docker.gpg
  
            echo \
              "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.gpg] \
              https://download.docker.com/linux/ubuntu \
              $(lsb_release -cs) stable" | \
              sudo tee /etc/apt/sources.list.d/docker.list > /dev/null
  
            sudo apt-get update
            sudo apt-get install -y docker-ce docker-ce-cli containerd.io docker-buildx-plugin docker-compose-plugin
  
            sudo systemctl enable --now docker
          fi
  
          # --- GHCR 로그인 (private package면 필수) ---
          if [ -n "${{ secrets.GHCR_USERNAME }}" ] && [ -n "${{ secrets.GHCR_READ_TOKEN }}" ]; then
            echo "Login to GHCR..."
            echo "${{ secrets.GHCR_READ_TOKEN }}" | sudo docker login ghcr.io -u "${{ secrets.GHCR_USERNAME }}" --password-stdin
          else
            echo "GHCR_USERNAME/GHCR_READ_TOKEN not set. Assuming image is public."
          fi
  
          # --- 배포 디렉토리 준비 ---
          sudo rm -rf /opt/af-agent
          sudo mkdir -p /opt/af-agent
          sudo chown -R $USER:$USER /opt/af-agent
          cd /opt/af-agent
  
          # --- git 설치 (없으면) ---
          if ! command -v git &> /dev/null; then
            sudo apt-get install -y git
          fi
  
          # --- 레포 clone 또는 pull ---
          git clone https://github.com/${GITHUB_REPOSITORY}.git .
          git checkout main
  
          # --- 최신 이미지 pull ---
          sudo docker pull ghcr.io/<owner-lower>/af_agent:sha-<sha>
  
          # --- 기존 컨테이너 종료 후 새로 띄우기 ---
          # docker down X (없는 명령) → docker compose down 으로 변경
          sudo docker compose down --remove-orphans || true
          
          sudo docker compose up -d

          # --- 오래된 이미지 정리 ---
          sudo docker image prune -af

