services:
  app:
    image: ${APP_IMAGE:-af_agent_local}
    build:
      context: .
      dockerfile: Dockerfile
    container_name: af_app
    environment:
      - ENABLE_PIPELINE_ROUTES=${ENABLE_PIPELINE_ROUTES:-true}
      - OPENROUTER=${OPENROUTER}
      - OPENROUTER_API_BASE=${OPENROUTER_API_BASE}
      - LANGCHAIN_ENDPOINT=${LANGCHAIN_ENDPOINT}
      - LANGCHAIN_PROJECT=${LANGCHAIN_PROJECT}
      - LANGCHAIN_API_KEY=${LANGCHAIN_API_KEY}
      - KAKAO_API_KEY=${KAKAO_API_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - SECRET_KEY=${SECRET_KEY}
      - PG_HOST=${PG_HOST}
      - PG_PORT=${PG_PORT:-5432}
      - PG_USER=${PG_USER}
      - PG_PASSWORD=${PG_PASSWORD}
      - PG_DATABASE=${PG_DATABASE}
      - EXTERNAL_API_TIMEOUT_SECONDS=${EXTERNAL_API_TIMEOUT_SECONDS:-25}
      - EXTERNAL_API_MAX_RETRIES=${EXTERNAL_API_MAX_RETRIES:-1}
      - DATABASE_CONNECT_TIMEOUT_SECONDS=${DATABASE_CONNECT_TIMEOUT_SECONDS:-5}
      - DATABASE_POOL_TIMEOUT_SECONDS=${DATABASE_POOL_TIMEOUT_SECONDS:-10}
      - STARTUP_DB_INIT_TIMEOUT_SECONDS=${STARTUP_DB_INIT_TIMEOUT_SECONDS:-10}
    ports:
      - 8000:8000
    volumes:
      - /opt/af-agent/volumes:/app/volumes
    tty: true

networks:
  default:
    name: af_agent
